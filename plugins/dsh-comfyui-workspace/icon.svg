    <rect x="5" y="6" width="54" height="16" rx="5" />
    <rect x="5" y="27" width="36" height="16" rx="5" />
    <rect x="5" y="48" width="36" height="11" rx="5" />
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="14" cy="14" r="2.6" />
    <circle cx="14" cy="35" r="2.6" />
    <circle cx="14" cy="53.5" r="2.6" />
  </g>
  <path d="M48 31.5 L60 38.5 L48 45.5 Z" fill="currentColor" stroke="none" />
</svg>
