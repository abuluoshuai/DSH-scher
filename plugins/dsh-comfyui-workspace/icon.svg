<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ComfyUI workspace">
  <!-- Three stacked workflow cards with a run triangle: the panel is a vertical
       pile of node cards, not a graph canvas. Drawn for this plugin. -->
