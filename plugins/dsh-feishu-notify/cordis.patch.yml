# dsh-feishu-notify — bundle patch
#
# Contributes one Host row. It watches every root Session on this machine: when
# a turn finishes it reads the durable log and pushes a Feishu message with the
# session name, the user prompt and the final assistant markdown.
#
# The Feishu bot itself comes from dsh-im (its `integrations/` config and the
# app secret in the credential store), so configure the bot there first.
#
#   - id: feishu-notify
#     config:
#       enabled: true
#       ignoreSubagents: true
#       botId: ''                # empty = first activated Feishu bot
#       receiveIdType: open_id   # open_id | chat_id
#       receiveId: ''            # empty = the bot's first owner open id
#       maxChars: 8000           # message cap, longer answers are truncated
- insert:
    - id: feishu-notify
      name: './plugins/dsh-feishu-notify/lib/index.js'
